name: sync-test
# Test: Kann ein GitHub-Runner die Matches von Rivals Data abrufen? (läuft nur bei Änderung dieser Datei)
on:
  push:
    branches: [claude/marvel-rivals-improvement-app-e4l00i]
    paths: [".github/workflows/sync-test.yml"]
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install rivals-api
      - run: python docs/marvel-rivals/rivals_sync.py "Jumagirl" --limit 5 --no-details -o /tmp/out.json
